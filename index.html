<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Talking Photo Generator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            color: #00e676;
            margin-top: 0;
        }
        label {
            font-size: 14px;
            color: #ccc;
            margin-top: 10px;
            display: block;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #00e676;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #00c853;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ffca28;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>AI ಮಾತನಾಡುವ ಫೋಟೋ</h2>

    <label>D-ID API Key:</label>
    <input type="password" id="apiKey" placeholder="ನಿಮ್ಮ D-ID API Key ಹಾಕಿ">

    <label>ಫೋಟೋ URL (Image Link):</label>
    <input type="url" id="imageUrl" placeholder="https://example.com/photo.jpg">

    <label>ಮಾತನಾಡಬೇಕಾದ ಮಾತುಗಳು (Text):</label>
    <textarea id="scriptText" rows="3" placeholder="ಇಲ್ಲಿ ಮಾತನಾಡುವ ಬರಹ ಬರೆಯಿರಿ..."></textarea>

    <button id="submitBtn" onclick="createTalkingVideo()">ವಿಡಿಯೋ ಕ್ರಿಯೇಟ್ ಮಾಡಿ</button>

    <div id="status"></div>
    <video id="videoResult" controls></video>
</div>

<script>
    async function createTalkingVideo() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const imageUrl = document.getElementById('imageUrl').value.trim();
        const scriptText = document.getElementById('scriptText').value.trim();
        const status = document.getElementById('status');
        const videoElement = document.getElementById('videoResult');
        const submitBtn = document.getElementById('submitBtn');

        if (!apiKey || !imageUrl || !scriptText) {
            alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಜಾಗಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ!");
            return;
        }

        submitBtn.disabled = true;
        videoElement.style.display = "none";
        status.innerHTML = "AI ವೀಡಿಯೊ ವಿನಂತಿ ಕಳುಹಿಸಲಾಗುತ್ತಿದೆ...";

        try {
            // Step 1: Request Video Generation from D-ID
            const response = await fetch('https://api.d-id.com/talks', {
                method: 'POST',
                headers: {
                    'Authorization': 'Basic ' + btoa(apiKey),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    source_url: imageUrl,
                    script: {
                        type: 'text',
                        subtitles: false,
                        provider: { type: 'microsoft', voice_id: 'kn-IN-GaganNeural' }, // Kannada Voice
                        input: scriptText
                    }
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "API ದೋಷ ಸಂಭವಿಸಿದೆ");
            }

            const talkId = data.id;
            status.innerHTML = "ವಿಡಿಯೋ ಪ್ರೊಸೆಸ್ ಆಗುತ್ತಿದೆ, ದಯವಿಟ್ಟು ಕಾಯಿರಿ...";

            // Step 2: Poll for Video Result
            checkVideoStatus(talkId, apiKey);

        } catch (error) {
            status.innerHTML = "<span style='color:red;'>ದೋಷ: " + error.message + "</span>";
            submitBtn.disabled = false;
        }
    }

    async function checkVideoStatus(talkId, apiKey) {
        const status = document.getElementById('status');
        const videoElement = document.getElementById('videoResult');
        const submitBtn = document.getElementById('submitBtn');

        const interval = setInterval(async () => {
            try {
                const response = await fetch(`https://api.d-id.com/talks/${talkId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Basic ' + btoa(apiKey),
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.status === 'done') {
                    clearInterval(interval);
                    status.innerHTML = "<span style='color:#00e676;'>ವಿಡಿಯೋ ಯಶಸ್ವಿಯಾಗಿ ತಯಾರಾಗಿದೆ!</span>";
                    videoElement.src = data.result_url;
                    videoElement.style.display = "block";
                    submitBtn.disabled = false;
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    status.innerHTML = "<span style='color:red;'>ವಿಡಿಯೋ ತಯಾರಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</span>";
                    submitBtn.disabled = false;
                } else {
                    status.innerHTML = "ವಿಡಿಯೋ ತಯಾರಾಗುತ್ತಿದೆ... ಜಸ್ಟ್ ವೇಟ್ (" + data.status + ")";
                }
            } catch (err) {
                clearInterval(interval);
                status.innerHTML = "<span style='color:red;'>ದೋಷ: " + err.message + "</span>";
                submitBtn.disabled = false;
            }
        }, 3000); // Check status every 3 seconds
    }
</script>

</body>
</html>
